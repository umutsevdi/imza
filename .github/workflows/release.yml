name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project_version="$(grep -m1 -oE 'VERSION +[0-9]+\.[0-9]+\.[0-9]+' \
              CMakeLists.txt | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          if [ -z "$project_version" ]; then
            echo "::error::Could not parse the project version from CMakeLists.txt."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] \
              && [ "$tag" != "$project_version" ]; then
            echo "::error::Tag v$tag does not match the CMake project version $project_version."
            exit 1
          fi
          echo "version=$project_version" >> "$GITHUB_OUTPUT"

  linux-deb:
    # Pinned to the oldest supported base: the build host's glibc sets the
    # floor of the produced binary, so this must stay at 22.04 (glibc 2.35)
    # for the .deb to run on Ubuntu 22.04 / Debian 12 and newer. arm64 runs
    # natively on GitHub's arm64 runner: no cross-compilation, no qemu.
    timeout-minutes: 45
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runs-on: ubuntu-latest
            container: ubuntu:22.04
          - arch: arm64
            runs-on: ubuntu-22.04-arm
            container: ubuntu:22.04
    steps:
      # Dependencies are installed before checkout because the base image
      # has no git, which actions/checkout requires.
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y git software-properties-common ca-certificates \
              gnupg python3 python3-pip libcurl4-openssl-dev libsecret-1-dev
          add-apt-repository -y ppa:ubuntu-toolchain-r/test
          apt-get update
          apt-get install -y gcc-14 g++-14
          # 22.04 ships cmake 3.25; the project requires 3.31.
          pip3 install cmake
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # The suite builds in the same tree as the release binary, so the
      # tests cost one extra compile of the test sources and nothing else.
      # They run before packaging: a broken build must not produce an artifact.
      - name: Build and test
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DIMZA_STATIC_RUNTIME=ON
          # Hosted runners OOM-kill the build near the imza_tests link when
          # several -O3 test TUs compile concurrently (exit 137 mid-run).
          cmake --build build --parallel 2
          ./build/release/imza_tests
      - name: Package
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cpack --config build/CPackConfig.cmake -G DEB -B build
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-deb
          path: build/imza-*.deb
          if-no-files-found: error

  linux-rpm:
    # Pinned to the oldest supported base: the build host's glibc sets the
    # floor of the produced binary, so this must stay at EL9 (glibc 2.34)
    # for the .rpm to run on AlmaLinux / Rocky 9 and newer. arm64 runs
    # natively on GitHub's arm64 runner: no cross-compilation, no qemu.
    timeout-minutes: 45
    runs-on: ${{ matrix.runs-on }}
    container: almalinux:9
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-22.04-arm
    steps:
      - name: Install dependencies
        run: |
          # EL9 ships python3.9 but the project requires Python 3.10+.
          dnf install -y gcc-toolset-14 cmake git libcurl-devel make \
              python3.11 rpm-build libsecret-devel
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build and test
        run: |
          source /opt/rh/gcc-toolset-14/enable
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DIMZA_STATIC_RUNTIME=ON \
              -DPython3_EXECUTABLE=/usr/bin/python3.11
          # Hosted runners OOM-kill the build near the imza_tests link when
          # several -O3 test TUs compile concurrently (exit 137 mid-run).
          cmake --build build --parallel 2
          ./build/release/imza_tests
      - name: Package
        run: |
          source /opt/rh/gcc-toolset-14/enable
          cpack --config build/CPackConfig.cmake -G RPM -B build
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-rpm
          path: build/imza-*.rpm
          if-no-files-found: error

  macos:
    timeout-minutes: 45
    runs-on: macos-15
    needs: prepare
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: brew install cmake
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Build and test
        run: |
          sdk_root="$(xcrun --sdk macosx --show-sdk-path)"
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_SYSROOT="$sdk_root" \
              -DCURL_NO_CURL_CMAKE=ON \
              -DCURL_LIBRARY="$sdk_root/usr/lib/libcurl.tbd" \
              -DCURL_INCLUDE_DIR="$sdk_root/usr/include"
          # Heavy -O3 test TUs thrash the hosted runner to the point of the
          # job appearing hung; low parallelism keeps memory under control.
          cmake --build build --parallel 2
          ./build/release/imza_tests
      - name: Package
        run: |
          otool -L build/release/imza
          if ! otool -L build/release/imza | grep -q '/usr/lib/libcurl'; then
            echo "::error::imza is not linked to the macOS system libcurl."
            exit 1
          fi
          cmake --build build --target package
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/imza-*.pkg
          if-no-files-found: error

  windows:
    timeout-minutes: 45
    runs-on: windows-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: choco install innosetup -y --no-progress
      # Multi-config generator: the test binary lands beside the release
      # executable, so one build serves both.
      - name: Build and test
        run: |
          cmake -S . -B build
          cmake --build build --config Release --parallel
          ./build/Release/imza_tests.exe
      - name: Stage installer input
        shell: bash
        run: |
          mkdir -p staging/release
          cp build/Release/imza.exe staging/release/imza.exe
          cp -r build/wiki-snapshot staging/wiki-snapshot
      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DSource="$env:GITHUB_WORKSPACE" `
            /DBuild="$env:GITHUB_WORKSPACE\staging" `
            /DimzaVersion="${{ needs.prepare.outputs.version }}" `
            win.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: staging/imza-*.exe
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [prepare, linux-deb, linux-rpm, macos, windows]
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber \
            -R "$GITHUB_REPOSITORY"

  website:
    # site downloads fetch the tagged release's assets, so this must only
    # run once they are attached (needs: release); "set as latest" is
    # independent of the site
    runs-on: ubuntu-latest
    needs: [prepare, release]
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: www/package-lock.json
      - name: Build site
        env:
          IMZA_VERSION: v${{ needs.prepare.outputs.version }}
        run: |
          cd www
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www/dist
      - uses: actions/deploy-pages@v4
  homebrew:
    # The tap repo (umutsevdi/homebrew-imza) is a plain store: this pipeline
    # is the only writer of Casks/imza.rb. Runs after `release` so the asset
    # URLs the cask points at are already uploaded. macOS ships arm64 only.
    runs-on: ubuntu-latest
    needs: [prepare, release]
    if: github.event_name == 'release'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Bump cask in umutsevdi/homebrew-imza
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          pkg="$(ls dist/imza-*-macos-arm64.pkg)" || true
          if [ -z "$pkg" ]; then
            echo "::error::Missing macOS arm64 pkg artifact; refusing to bump the cask."
            exit 1
          fi
          sha="$(sha256sum "$pkg" | cut -d' ' -f1)"

          gh auth setup-git
          gh repo clone umutsevdi/homebrew-imza tap -- --depth 1
          cd tap

          sed -i \
            -e "s/version \".*\"/version \"$VERSION\"/" \
            -e "s/sha256 \"[a-f0-9]\{64\}\"/sha256 \"$sha\"/" \
            Casks/imza.rb

          # Fail loudly if the rewrite did not land (cask format changed).
          grep -q "version \"$VERSION\"" Casks/imza.rb
          grep -q "sha256 \"$sha\"" Casks/imza.rb
          if git diff --quiet; then
            echo "::error::Cask unchanged after bump; version $VERSION may already be published."
            exit 1
          fi

          git config user.name "release-bot"
          git config user.email "mail@umutsevdi.com"
          git commit -am "imza $VERSION"
          git push
