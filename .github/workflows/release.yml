name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project_version="$(grep -m1 -oE 'VERSION +[0-9]+\.[0-9]+\.[0-9]+' \
              CMakeLists.txt | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          if [ -z "$project_version" ]; then
            echo "::error::Could not parse the project version from CMakeLists.txt."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] \
              && [ "$tag" != "$project_version" ]; then
            echo "::error::Tag v$tag does not match the CMake project version $project_version."
            exit 1
          fi
          echo "version=$project_version" >> "$GITHUB_OUTPUT"

  linux-deb:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev gcc-14 g++-14
      - name: Build and package
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DIMZA_BUILD_TESTS=OFF
          cmake --build build
          cpack --config build/CPackConfig.cmake -G DEB -B build
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-deb
          path: build/imza-*.deb
          if-no-files-found: error

  linux-rpm:
    runs-on: ubuntu-latest
    container: fedora:43
    needs: prepare
    steps:
      - name: Install dependencies
        run: |
          dnf install -y cmake gcc-c++ git libcurl-devel make python3 rpm-build
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build and package
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DIMZA_BUILD_TESTS=OFF
          cmake --build build
          cpack --config build/CPackConfig.cmake -G RPM -B build
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-rpm
          path: build/imza-*.rpm
          if-no-files-found: error

  macos:
    runs-on: macos-15
    needs: prepare
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: brew install cmake
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Build and package
        run: |
          sdk_root="$(xcrun --sdk macosx --show-sdk-path)"
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DIMZA_BUILD_TESTS=OFF \
              -DCMAKE_OSX_SYSROOT="$sdk_root" \
              -DCURL_NO_CURL_CMAKE=ON \
              -DCURL_LIBRARY="$sdk_root/usr/lib/libcurl.tbd" \
              -DCURL_INCLUDE_DIR="$sdk_root/usr/include"
          cmake --build build
          otool -L build/release/imza
          if ! otool -L build/release/imza | grep -q '/usr/lib/libcurl'; then
            echo "::error::imza is not linked to the macOS system libcurl."
            exit 1
          fi
          cmake --build build --target package
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/imza-*.pkg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: choco install innosetup -y --no-progress
      - name: Build
        run: |
          cmake -S . -B build -DIMZA_BUILD_TESTS=OFF
          cmake --build build --config Release
      - name: Stage installer input
        shell: bash
        run: |
          mkdir -p staging/release
          cp build/Release/imza.exe staging/release/imza.exe
      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DSource="$env:GITHUB_WORKSPACE" `
            /DBuild="$env:GITHUB_WORKSPACE\staging" `
            /DimzaVersion="${{ needs.prepare.outputs.version }}" `
            win.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: staging/imza-*.exe
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [prepare, linux-deb, linux-rpm, macos, windows]
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber \
            -R "$GITHUB_REPOSITORY"
