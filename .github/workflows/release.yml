name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project_version="$(grep -m1 -oE 'VERSION +[0-9]+\.[0-9]+\.[0-9]+' \
              CMakeLists.txt | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          if [ -z "$project_version" ]; then
            echo "::error::Could not parse the project version from CMakeLists.txt."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] \
              && [ "$tag" != "$project_version" ]; then
            echo "::error::Tag v$tag does not match the CMake project version $project_version."
            exit 1
          fi
          echo "version=$project_version" >> "$GITHUB_OUTPUT"

  linux-x64:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev gcc-14 g++-14
      - name: Build and package
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DIMZA_BUILD_TESTS=OFF
          cmake --build build
          cmake --build build --target package
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            build/imza-*.deb
            build/imza-*.rpm
          if-no-files-found: error

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    needs: prepare
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev gcc-14 g++-14
      - name: Build and package
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DIMZA_BUILD_TESTS=OFF
          cmake --build build
          cmake --build build --target package
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: |
            build/imza-*.deb
            build/imza-*.rpm
          if-no-files-found: error

  macos:
    runs-on: macos-15
    needs: prepare
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: brew install cmake curl
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Build and package
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DIMZA_BUILD_TESTS=OFF \
              -DCURL_ROOT="$(brew --prefix curl)"
          cmake --build build
          cmake --build build --target package
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/imza-*.pkg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: choco install innosetup -y --no-progress
      - name: Build
        run: |
          cmake -S . -B build -DIMZA_BUILD_TESTS=OFF
          cmake --build build --config Release
      - name: Stage installer input
        shell: bash
        run: |
          mkdir -p staging/release
          cp build/Release/imza.exe staging/release/imza.exe
      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DSource="$env:GITHUB_WORKSPACE" `
            /DBuild="$env:GITHUB_WORKSPACE\staging" `
            /DimzaVersion="${{ needs.prepare.outputs.version }}" `
            win.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: staging/imza-*.exe
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [prepare, linux-x64, linux-arm64, macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "imza $GITHUB_REF_NAME" \
            --notes "Download the artifact matching your platform \
          (imza-<version>-<os>-<arch>.<ext>). Install with \
          'sudo apt install ./imza-*.deb', 'sudo dnf install ./imza-*.rpm', \
          the .pkg installer, or the .exe. macOS packages are unsigned; \
          right-click the app and choose Open on first launch to bypass \
          Gatekeeper. Installed builds check for a newer release daily and \
          'imza --update' installs it."
